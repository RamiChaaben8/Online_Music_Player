  # ── Publish GitHub Release ─────────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    # Add build-macos and build-linux to the needs list when those jobs are enabled.

    steps:
      - name: Checkout (for commit history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: utify-windows
          path: artifacts/

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            NOTES=$(git log --pretty=format:"- %s" | head -30)
          else
            NOTES=$(git log "${PREV}..HEAD" --pretty=format:"- %s")
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Utify ${{ github.ref_name }}"
          body: |
            ## What's new in ${{ github.ref_name }}

            ${{ steps.changelog.outputs.notes }}

            ---
            **Platform support:** Windows ✅ &nbsp;|&nbsp; macOS 🔜 &nbsp;|&nbsp; Linux 🔜
          draft: false
          prerelease: false
          files: artifacts/utify-windows-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
