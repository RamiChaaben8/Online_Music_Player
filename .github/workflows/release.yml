name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:

  # ── Windows build ───────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Write install.bat
        shell: pwsh
        run: |
          $dir = "build\windows\x64\runner\Release"
          @"
          @echo off
          echo Installing Utify...
          xcopy /E /I /Y "%~dp0." "%LOCALAPPDATA%\Utify\"
          echo Done. You can close this window and relaunch Utify.
          pause
          "@ | Set-Content "$dir\install.bat"

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
                           -DestinationPath "utify-windows.zip" -Force
          Write-Host "Zip size: $((Get-Item utify-windows.zip).Length) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utify-windows
          path: utify-windows.zip
          retention-days: 1

